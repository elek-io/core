# How long a release has to be public before an install takes it, in minutes.
# This is pnpm's own default, written down because Dependabot's cooldown has to
# stay above it: a pull request proposing a version younger than this fails at
# `pnpm install --frozen-lockfile` on every platform before the suite runs.
# See .github/dependabot.yml and https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 1440

# Build script approval for dependencies.
# pnpm 11 removed onlyBuiltDependencies and ignoredBuiltDependencies and replaced
# them with a single allowBuilds map of package -> boolean.
# See https://pnpm.io/settings#allowbuilds
allowBuilds:
  # dugite is Core's git engine (see src/service/GitService.ts). Its postinstall
  # downloads the embedded git executable, so the build must run or every git
  # operation at runtime fails.
  dugite: true
  # esbuild arrives transitively via astro, vite and vitest (all devDependencies)
  # and is never part of Core's runtime. Its platform binary already ships
  # prebuilt in @esbuild/<platform>, which the JS API resolves directly, so its
  # postinstall build is redundant.
  esbuild: false
  # sharp arrives transitively via astro (a devDependency) for its image
  # optimization service. Core only provides Astro content loaders and never
  # processes images, so its native build is intentionally skipped.
  sharp: false
